name: tests

on:
  push:
    branches:
      - feature/docker-setup
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    environment: Testing
    strategy:
      matrix:
        php-version: ['8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - uses: pnpm/action-setup@v4

      - name: Install Node Dependencies
        run: pnpm install --frozen-lockfile

      - name: Add Flux Credentials Loaded From ENV
        run: composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Build Assets
        run: pnpm run build

      - name: Run Tests
        run: ./vendor/bin/pest

  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:26.10
        env:
          MYSQL_ROOT_PASSWORD: test-root-password
          MYSQL_DATABASE: project_test
          MYSQL_USER: project_test
          MYSQL_PASSWORD: test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -ptest-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - name: Build test image
        run: docker build --target app-test -t project-tests .

      - name: Test migrations, seeding and application against MySQL
        run: |
          docker run --rm --network host \
            -e APP_ENV=testing \
            -e APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            -e DB_CONNECTION=mysql \
            -e DB_HOST=127.0.0.1 \
            -e DB_DATABASE=project_test \
            -e DB_USERNAME=project_test \
            -e DB_PASSWORD=test-password \
            -e CACHE_STORE=array \
            -e SESSION_DRIVER=array \
            -e QUEUE_CONNECTION=sync \
            project-tests sh -c 'php artisan migrate --seed --force && php artisan db:seed --force && php artisan migrate:rollback --force && php artisan test'
