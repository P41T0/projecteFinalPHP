name: browser-tests

on:
  push:
    branches:
      - pest-ci
      - develop
      - main
  pull_request:
    branches:
      - pest-ci
      - develop
      - main

jobs:
  check-browser-tests-access:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - name: Check browser tests credentials
        id: check
        env:
          BROWSER_TESTS_TOKEN: ${{ secrets.BROWSER_TESTS_TOKEN }}
        run: |
          if [ -n "$BROWSER_TESTS_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Browser tests skipped. Configure BROWSER_TESTS_TOKEN with read access to laravel-labs/starter-kit-browser-tests."
          fi

  ci:
    needs: check-browser-tests-access
    if: needs.check-browser-tests-access.outputs.available == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - uses: pnpm/action-setup@v4

      - name: Install Node Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Dependencies
        run: pnpm add --save-dev playwright@1.65.1

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: Add `laravel-labs/starter-kit-browser-tests` Repository
        run: |
          composer config repositories.browser-tests '{"type": "vcs", "url": "https://github.com/laravel-labs/starter-kit-browser-tests"}' --file composer.json
          composer remove "phpunit/phpunit" --dev --no-update
          composer require "laravel-labs/starter-kit-browser-tests:dev-main@dev" --dev --no-update

      - name: Add Flux Credentials Loaded From ENV
        run: composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"

      - name: Add browser tests repository credentials
        env:
          BROWSER_TESTS_TOKEN: ${{ secrets.BROWSER_TESTS_TOKEN }}
        run: composer config --global github-oauth.github.com "$BROWSER_TESTS_TOKEN"

      - name: Install Dependencies
        run: composer update --with-all-dependencies --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Setup Test Environment
        run: |
           cp vendor/laravel-labs/starter-kit-browser-tests/phpunit.xml.dist .
           rm phpunit.xml
           rm -Rf tests/
           cp -rf vendor/laravel-labs/starter-kit-browser-tests/tests/ tests/

      - name: Build Assets
        run: pnpm run build

      - name: Tests
        run: php vendor/bin/pest
